name: Publish docs site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the repo files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Gather pages into a docs folder
        run: |
          mkdir -p docs
          cp README.md docs/index.md
          cp AUDIENCE_TIERS.md docs/
          cp -r schema wireframes voice governance data release_input test docs/
          rm -f docs/voice/audience_tiers.md

      - name: Build the site
        run: mkdocs build

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
